<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melhor Preço - Comparador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        
        /* Estilo da Header com sua Logo */
        .header-section { 
            background: white; 
            padding: 30px 0; 
            text-align: center; 
            border-bottom: 4px solid #28a745;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .logo-img { 
            max-height: 200px; /* Ajuste conforme o tamanho da sua logo */
            }
        .brand-name { 
            color: #28a745; 
            font-weight: 800; 
            font-size: 2.5rem; 
            letter-spacing: -1px;
        }

        /* Cards de Produtos */
        .card-produto { 
            border: none; 
            border-radius: 15px; 
            height: 100%; 
            transition: 0.3s; 
            background: white;
        }
        .card-produto:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .img-box { height: 160px; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .img-box img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .preco-final { font-size: 1.5rem; font-weight: bold; color: #28a745; }
        .loja-badge { background: #e9ecef; color: #495057; font-weight: bold; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; }
    </style>
</head>
<body>

<div class="header-section">
    <div class="container">
        <img src="static/logo.png" alt="Melhor Preço Logo" class="logo-img" onerror="this.style.display='none'">
                
        <form method="POST" class="row justify-content-center mt-4">
            <div class="col-md-6">
                <div class="input-group input-group-lg shadow-sm">
                    <input type="text" name="item" class="form-control border-0" placeholder="O que vamos comprar hoje?" value="{{ item }}" required>
                    <button class="btn btn-success px-4 fw-bold" type="submit">BUSCAR</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="container mt-5">
    {% if resultados %}
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4 mb-5">
        {% for r in resultados %}
        <div class="col">
            <div class="card card-produto p-3 shadow-sm text-center">
                <div class="img-box">
                    <img src="{{ r.thumbnail }}" alt="Produto">
                </div>
                <div class="card-body d-flex flex-column">
                    <div><span class="loja-badge">{{ r.loja }}</span></div>
                    <h6 class="mt-3 text-secondary" style="height: 40px; overflow: hidden; font-size: 0.9rem;">{{ r.produto }}</h6>
                    <p class="preco-final my-2">{{ r.preco_exibicao }}</p>
                    
                    <button onclick="copiarLink('{{ r.link }}', this)" class="btn btn-outline-success mt-auto rounded-pill fw-bold btn-sm py-2">
                        📋 COPIAR LINK DA OFERTA
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% elif item %}
    <div class="alert alert-light text-center shadow-sm">
        Nenhum supermercado encontrado para "{{ item }}". Tente outro termo ou verifique se a loja é um supermercado.
    </div>
    {% endif %}
</div>

<script>
function copiarLink(url, elemento) {
    const el = document.createElement('textarea');
    el.value = url;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);

    const textoOriginal = elemento.innerHTML;
    elemento.innerHTML = "✅ LINK NA MEMÓRIA!";
    elemento.classList.replace('btn-outline-success', 'btn-success');
    elemento.classList.add('text-white');
    
    setTimeout(() => {
        elemento.innerHTML = textoOriginal;
        elemento.classList.replace('btn-success', 'btn-outline-success');
        elemento.classList.remove('text-white');
    }, 2000);
}
</script>

</body>
</html>
